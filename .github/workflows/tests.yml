name: tests

on:
  push:
    branches: [master]
    paths-ignore: ["**.md"]
  pull_request:
    branches-ignore:
      - "gh-pages"
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-unit:
    name: root unit (Go ${{ matrix.go }})
    strategy:
      matrix:
        go: ["1.26", "1.25", "1.24", "1.23", "1.22"]
        platform: [ubuntu-latest] # can not run in windows OS
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 15

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Set up Go 1.x
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go.sum
            tests/go.sum
            tools/gentool/go.sum
            examples/go.sum

      - name: Tests
        run: go test -race ./...

  sqlite-runtime:
    name: SQLite generation and runtime
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Set up canonical Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: |
            go.sum
            tests/go.sum

      - name: Verify generated fixture and golden comparator
        run: go -C tests test -race -count=1 ./generation/... ./internal/golden/...

      - name: Run SQLite runtime contracts
        run: go -C tests test -race -count=1 ./runtime/...

  mysql:
    strategy:
      matrix:
        dbversion: ["mysql:5.7", "mysql:latest"]
        go: ["1.26", "1.25", "1.24", "1.23", "1.22"]
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30

    services:
      mysql:
        image: ${{ matrix.dbversion }}
        env:
          MYSQL_DATABASE: gen
          MYSQL_USER: gen
          MYSQL_PASSWORD: gen
          MYSQL_ROOT_PASSWORD: 123456
        ports:
          - 9910:3306
        options: >-
          --health-cmd "mysqladmin ping -ugen -pgen"
          --health-interval 10s
          --health-start-period 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Set up Go 1.x
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go.sum
            tests/go.sum
            tools/gentool/go.sum
            examples/go.sum

      - name: Tests
        run: GITHUB_ACTION=true GORM_DIALECT=mysql GEN_DSN="gen:gen@tcp(localhost:9910)/gen?charset=utf8&parseTime=True&sql_mode=NO_ENGINE_SUBSTITUTION" ./tests/test.sh

  modules:
    name: test nested modules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: |
            tools/gentool/go.sum
            examples/go.sum

      - name: Test examples module
        run: go -C examples test ./...

      - name: Test gentool module
        run: go -C tools/gentool test ./...

  coverage:
    name: canonical coverage artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Set up canonical Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: |
            go.sum
            tests/go.sum

      - name: Collect root coverage
        run: go test -covermode=atomic -coverprofile=coverage-root.out ./...

      - name: Collect SQLite runtime coverage
        run: go -C tests test -covermode=atomic -coverpkg=gorm.io/gen,gorm.io/gen/field,gorm.io/gen/helper,gorm.io/gen/internal/... -coverprofile=coverage-runtime.out ./runtime/...

      - name: Upload root coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-root-go-1.26
          path: coverage-root.out

      - name: Upload SQLite runtime coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-runtime-go-1.26
          path: tests/coverage-runtime.out

  tidy:
    name: go mod tidy check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: |
            go.sum
            tests/go.sum
            tools/gentool/go.sum
            examples/go.sum

      - name: Check all modules are tidy
        run: |
          go mod tidy && git diff --exit-code go.mod go.sum
          cd tests && go mod tidy && git diff --exit-code go.mod go.sum
          cd ../tools/gentool && go mod tidy && git diff --exit-code go.mod go.sum
          cd ../../examples && go mod tidy && git diff --exit-code go.mod go.sum
