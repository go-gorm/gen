name: tests

on:
  push:
    branches: [master]
    paths-ignore: ["**.md"]
  pull_request:
    branches-ignore:
      - "gh-pages"
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Label of the container job
  tests:
    strategy:
      matrix:
        go: ["1.24", "1.23", "1.22", "1.21", "1.20", "1.19", "1.18"]
        platform: [ubuntu-latest] # can not run in windows OS
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 15

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v5

      - name: Set up Go 1.x
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go.sum
            tests/go.sum
            tools/gentool/go.sum
            examples/go.sum

      - name: Tests
        run: go test -race ./...

  mysql:
    strategy:
      matrix:
        dbversion: ["mysql:5.7", "mysql:latest"]
        go: ["1.24", "1.23", "1.22", "1.21", "1.20", "1.19", "1.18"]
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30

    services:
      mysql:
        image: ${{ matrix.dbversion }}
        env:
          MYSQL_DATABASE: gen
          MYSQL_USER: gen
          MYSQL_PASSWORD: gen
          MYSQL_ROOT_PASSWORD: 123456
        ports:
          - 9910:3306
        options: >-
          --health-cmd "mysqladmin ping -ugen -pgen"
          --health-interval 10s
          --health-start-period 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v5

      - name: Set up Go 1.x
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go.sum
            tests/go.sum
            tools/gentool/go.sum
            examples/go.sum

      - name: Tests
        run: GITHUB_ACTION=true GORM_DIALECT=mysql GEN_DSN="gen:gen@tcp(localhost:9910)/gen?charset=utf8&parseTime=True&sql_mode=NO_ENGINE_SUBSTITUTION" ./tests/test.sh

  modules:
    name: build nested modules
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: |
            tools/gentool/go.sum
            examples/go.sum

      - name: Build examples module
        run: cd examples && go build ./...

      - name: Build gentool module
        run: cd tools/gentool && go build ./...

  tidy:
    name: go mod tidy check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: |
            go.sum
            tests/go.sum
            tools/gentool/go.sum
            examples/go.sum

      - name: Check all modules are tidy
        run: |
          go mod tidy && git diff --exit-code go.mod go.sum
          cd tests && go mod tidy && git diff --exit-code go.mod go.sum
          cd ../tools/gentool && go mod tidy && git diff --exit-code go.mod go.sum
          cd ../../examples && go mod tidy && git diff --exit-code go.mod go.sum
